name: Deploy to Server

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        docker build -t speak-swift:${{ github.sha }} -f ci_cd/Dockerfile .
        
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          # Останавливаем старый контейнер
          docker stop speak-swift-app || true
          docker rm speak-swift-app || true
          
          # Удаляем старый образ
          docker rmi speak-swift:latest || true
          
          # Создаем директорию для проекта если её нет
          mkdir -p /opt/speak-swift
          
          # Переходим в директорию проекта
          cd /opt/speak-swift
          
          # Клонируем/обновляем репозиторий
          if [ -d ".git" ]; then
            git pull origin main
          else
            git clone https://github.com/${{ github.repository }}.git .
          fi
          
          # Собираем новый образ
          docker build -t speak-swift:latest -f ci_cd/Dockerfile .
          
          # Запускаем новый контейнер
          docker run -d \
            --name speak-swift-app \
            --restart unless-stopped \
            -p 80:80 \
            speak-swift:latest
          
          # Очищаем неиспользуемые образы
          docker image prune -f 